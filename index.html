<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR Scanner</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#7c3aed" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="QR Scanner" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0a0f;
      color: #e0e0f0;
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 20%, rgba(88, 28, 220, 0.15) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(30, 10, 120, 0.2) 0%, transparent 50%);
      pointer-events: none;
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 300;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #a78bfa;
      margin-bottom: 2rem;
      opacity: 0.85;
    }

    .scanner-wrap {
      position: relative;
      width: min(90vw, 380px);
      aspect-ratio: 1;
    }

    .corner {
      position: absolute;
      width: 28px;
      height: 28px;
      z-index: 10;
    }
    .corner::before,
    .corner::after {
      content: '';
      position: absolute;
      background: #7c3aed;
      border-radius: 2px;
    }
    .corner::before { width: 100%; height: 3px; top: 0; left: 0; }
    .corner::after  { width: 3px; height: 100%; top: 0; left: 0; }

    .corner.tr { top: 0; right: 0; transform: rotate(90deg); }
    .corner.bl { bottom: 0; left: 0; transform: rotate(270deg); }
    .corner.br { bottom: 0; right: 0; transform: rotate(180deg); }

    .scan-line {
      position: absolute;
      left: 8px;
      right: 8px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #7c3aed, #a78bfa, #7c3aed, transparent);
      box-shadow: 0 0 12px 2px rgba(124, 58, 237, 0.7);
      z-index: 9;
      animation: scan 2.4s ease-in-out infinite;
    }

    @keyframes scan {
      0%   { top: 8px;   opacity: 0; }
      5%   { opacity: 1; }
      95%  { opacity: 1; }
      100% { top: calc(100% - 10px); opacity: 0; }
    }

    video, canvas.overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border-radius: 12px;
      object-fit: cover;
    }

    canvas.overlay {
      pointer-events: none;
      z-index: 5;
    }

    video {
      z-index: 1;
      background: #0d0d1a;
    }

    .scanner-wrap::after {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 12px;
      border: 1px solid rgba(124, 58, 237, 0.3);
      box-shadow:
        inset 0 0 40px rgba(0,0,0,0.5),
        0 0 30px rgba(124, 58, 237, 0.15);
      pointer-events: none;
      z-index: 8;
    }

    #status {
      margin-top: 1.8rem;
      font-size: 0.95rem;
      letter-spacing: 0.08em;
      color: #6d6d8f;
      min-height: 1.4em;
      transition: color 0.3s;
    }

    #status.found {
      color: #a78bfa;
      animation: pulse 0.5s ease;
    }

    @keyframes pulse {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.06); }
      100% { transform: scale(1); }
    }

    #url-preview {
      margin-top: 0.6rem;
      font-size: 0.8rem;
      color: #4c4c72;
      max-width: min(90vw, 380px);
      text-align: center;
      word-break: break-all;
      min-height: 1.2em;
    }
  </style>
</head>
<body>

  <h1>QR Scanner</h1>

  <div class="scanner-wrap">
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>
    <div class="scan-line"></div>
    <video id="video" autoplay muted playsinline></video>
    <canvas id="canvas" class="overlay"></canvas>
  </div>

  <p id="status">正在啟動相機…</p>
  <p id="url-preview"></p>

  <script>
    const video   = document.getElementById('video');
    const canvas  = document.getElementById('canvas');
    const ctx     = canvas.getContext('2d');
    const status  = document.getElementById('status');
    const urlPrev = document.getElementById('url-preview');

    let scanning = true;

    // 啟動相機
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
      .then(stream => {
        video.srcObject = stream;
        video.play();
        status.textContent = '將 QR Code 對準掃描框';
        requestAnimationFrame(tick);
      })
      .catch(err => {
        status.textContent = '無法存取相機：' + err.message;
      });

    function tick() {
      if (!scanning) return;
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        canvas.width  = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0);
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imgData.data, imgData.width, imgData.height, {
          inversionAttempts: 'dontInvert'
        });
        if (code) {
          const raw = code.data;
          drawBox(code.location);
          if (/^https?:\/\//i.test(raw)) {
            scanning = false;
            onFound(raw);
          } else {
            status.textContent = '非網址 QR Code，繼續掃描…';
          }
        }
      }
      requestAnimationFrame(tick);
    }

    function drawBox(loc) {
      ctx.beginPath();
      ctx.moveTo(loc.topLeftCorner.x, loc.topLeftCorner.y);
      ctx.lineTo(loc.topRightCorner.x, loc.topRightCorner.y);
      ctx.lineTo(loc.bottomRightCorner.x, loc.bottomRightCorner.y);
      ctx.lineTo(loc.bottomLeftCorner.x, loc.bottomLeftCorner.y);
      ctx.closePath();
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#7c3aed';
      ctx.shadowColor = '#a78bfa';
      ctx.shadowBlur = 10;
      ctx.stroke();
    }

    function onFound(url) {
      status.classList.add('found');
      status.textContent = '✓ 偵測到 QR Code，正在跳轉…';
      urlPrev.textContent = url;
      // 跳轉前先停掉相機
      if (video.srcObject) {
        video.srcObject.getTracks().forEach(t => t.stop());
        video.srcObject = null;
      }
      window.location.href = url;
    }

    // 禁用 bfcache，返回時強制重新載入頁面
    window.addEventListener('unload', () => {});
    window.addEventListener('pageshow', (e) => {
      if (e.persisted) window.location.reload();
    });
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('SW registered:', reg.scope))
          .catch(err => console.warn('SW registration failed:', err));
      });
    }
  </script>
</body>
</html>
